recipe_version: "1"
name: DeepSeek V4 Flash spark4+worker Docker fallback HMA KV offload
description: Fallback/repro Docker build for the two-node DSV4 lane. Rebuilds the same source lineage used by the host-local runtime: jasl/vllm@dda4668b59567416f86956cfe7bbc1eab371a61e plus the narrow DS4 KV/trim source PR.
model: deepseek-ai/DeepSeek-V4-Flash
container: vllm-node-dsv4-lmcache-rankfix
cluster_only: true
build_args:
  - --vllm-repo
  - https://github.com/experiencenow-ai/vllm.git
  - --vllm-ref
  - d240cdbcf3de175be57c108fd9cbfce04009ec29
  - --rebuild-vllm
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 2
  block_size: 256
  kv_offloading_size: 8
  served_model_name: deepseek-v4-flash
env:
  TORCH_CUDA_ARCH_LIST: 12.1a
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_SIMPLE_KV_OFFLOAD: "1"
  VLLM_TRITON_MLA_SPARSE: "1"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  DG_JIT_USE_NVRTC: "0"
  DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
  DG_JIT_PRINT_COMPILER_COMMAND: "1"
  NCCL_IB_DISABLE: "1"
  NCCL_SOCKET_IFNAME: enP7s7
  GLOO_SOCKET_IFNAME: enP7s7
  TP_SOCKET_IFNAME: enP7s7
  NCCL_DEBUG: WARN
command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --enable-expert-parallel \
    --kv-cache-dtype fp8 \
    --block-size {block_size} \
    --enable-prefix-caching \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --no-disable-hybrid-kv-cache-manager \
    --kv-offloading-size {kv_offloading_size} \
    --kv-offloading-backend native \
    --kv-cache-metrics \
    --enable-logging-iteration-details \
    --distributed-executor-backend mp \
    --no-enable-flashinfer-autotune \
    --enforce-eager \
    --speculative-config '{{"method":"deepseek_mtp","num_speculative_tokens":2}}' \
    --tokenizer-mode deepseek_v4 \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
    --default-chat-template-kwargs '{{"thinking":true}}' \
    --load-format safetensors
