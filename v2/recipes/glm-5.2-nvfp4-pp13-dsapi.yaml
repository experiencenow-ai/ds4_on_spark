name: glm-5.2-nvfp4-pp13-dsapi
description: GLM-5.2 ModelOpt NVFP4 full-ring PP13 DSAPI smoke and ds4-eval recipe.
model_repo: lukealonso/GLM-5.2-NVFP4
profile_id: glm52_nvfp4_pp13_frontier_v1
service_id: glm52_nvfp4_pp13
served_model_name: glm-5.2-nvfp4-pp13
topology: profiles/topology/static_sparks_glm52_nvfp4_pp13.json
kv_cache_deployment: profiles/kv_cache/glm52_nvfp4_pp13_lmcache_hma.json
runtime_contract: profiles/runtime_contracts/glm52_nvfp4_pp13_v1.json
download:
  active_source: /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4
  download_log: /home/spark0/ds4_logs/downloads/glm52_nvfp4_download_20260621T2246Z.log
  expected_bytes: 467056253928
  expected_files: 99
  expected_model_shards: 87
notes:
  - The source repo is lukealonso/GLM-5.2-NVFP4, a ModelOpt NVFP4 quantization of zai-org/GLM-5.2. Hugging Face metadata reports 87 model shards plus model-mtp.safetensors and input-scale sidecars.
  - Use the same IndexShare-safe PP13 partition as FP8: 6,4,4,4,4,8,8,8,8,8,4,4,8. Stage starts are full-indexer layers, so the sparse-attention shared-indexer constraint is preserved.
  - First launch keeps MTP disabled even though the repo includes model-mtp.safetensors. Enable MTP only after the separate PP-safe MTP preflight and canary pass.
  - KV cache remains fp8_e4m3. Do not switch GLM MLA to nvfp4 KV cache unless vLLM explicitly supports nvfp4 KV with MLA.
  - Native FP4 is required. The profile pins flashinfer-cutlass for linear and MoE and disables MarlinNvFp4LinearKernel plus EmulationNvFp4LinearKernel so a bad fallback fails early.
  - The active full archive lives on spark0 external NVMe. Mac 22TB is an inactive/archive target, not the active source for launch.
  - Stage every node with the fast-copy waterfall script: spark0 keeps the full archive on external NVMe, while /home/{node}/models/hf/lukealonso/GLM-5.2-NVFP4 contains only the files needed by that pipeline rank.
  - Once the HF index is present, use --watch-source to overlap download, archive mirror, and Spark waterfall staging. Completed files can move immediately; never copy *.part files.
  - Spark-to-Spark waterfall hops must use --transfer-mode fast-copy. Plain rsync is a debug fallback, not the normal model-staging path.
  - Canonical runbook: docs/spark-waterfall-model-staging.md.
paths:
  active_full_archive: /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4
  inactive_mac_archive: /mnt/mac/22tb0/models/hf/lukealonso/GLM-5.2-NVFP4
  node_local_template: /home/{node}/models/hf/lukealonso/GLM-5.2-NVFP4
commands:
  check_archive: |
    ssh spark0 'du -sh /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 2>/dev/null || true; find /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 -maxdepth 1 -type f -name "*.safetensors" | wc -l; find /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 -maxdepth 1 -type f -name "*.part" | wc -l; tail -n 20 /home/spark0/ds4_logs/downloads/glm52_nvfp4_download_20260621T2246Z.log 2>/dev/null || true'
  preflight_archive_config: |
    ssh spark0 'cd ~/src/ds4_on_spark/v2 && /home/spark0/ds4-vllm-local/bin/python scripts/ds4_glm52_nvfp4_preflight.py --model-dir /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 --vllm-source-root /home/spark0/standard-runtimes/vllm-0.23.0-overlay'
  preflight_complete_archive: |
    ssh spark0 'cd ~/src/ds4_on_spark/v2 && /home/spark0/ds4-vllm-local/bin/python scripts/ds4_glm52_nvfp4_preflight.py --model-dir /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 --vllm-source-root /home/spark0/standard-runtimes/vllm-0.23.0-overlay --check-files-complete --expect-shards 87'
  snapshot_completed_manifest: |
    ssh spark0 'cd /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 && find . -type f ! -name "*.part" ! -path "./.cache/*" -printf "%P\n" | sort' >/private/tmp/glm52_nvfp4_completed_include.txt
  dry_run_waterfall_stage: |
    ssh spark0 'cd ~/src/ds4_on_spark && python3 scripts/ds4_waterfall_stage_model.py --source-full-dir /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 --repo-id lukealonso/GLM-5.2-NVFP4 --ssh-host-template "{node}@{node}-200g" --transfer-mode fast-copy'
  waterfall_stage: |
    ssh spark0 'cd ~/src/ds4_on_spark && python3 scripts/ds4_waterfall_stage_model.py --source-full-dir /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 --repo-id lukealonso/GLM-5.2-NVFP4 --ssh-host-template "{node}@{node}-200g" --transfer-mode fast-copy --replace-existing --execute'
  waterfall_stage_streaming: |
    ssh spark0 'mkdir -p /home/spark0/ds4_logs/waterfall; cd ~/src/ds4_on_spark; nohup python3 scripts/ds4_waterfall_stage_model.py --source-full-dir /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4 --repo-id lukealonso/GLM-5.2-NVFP4 --ssh-host-template "{node}@{node}-200g" --transfer-mode fast-copy --replace-existing --execute --watch-source < /dev/null > /home/spark0/ds4_logs/waterfall/glm52_nvfp4_waterfall_streaming.log 2>&1 & echo $!'
  archive_to_mac_22tb0: |
    ssh spark0 'mkdir -p /mnt/mac/22tb0/models/hf/lukealonso/GLM-5.2-NVFP4 && rsync -rt --omit-dir-times --no-perms --no-owner --no-group --info=progress2 --exclude "*.part" /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4/ /mnt/mac/22tb0/models/hf/lukealonso/GLM-5.2-NVFP4/'
  archive_to_mac_22tb0_rolling: |
    ssh spark0 'mkdir -p /mnt/mac/22tb0/models/hf/lukealonso/GLM-5.2-NVFP4 && while pgrep -f "hf download lukealonso/GLM-5.2-NVFP4" >/dev/null; do rsync -rt --omit-dir-times --no-perms --no-owner --no-group --info=progress2 --exclude "*.part" /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4/ /mnt/mac/22tb0/models/hf/lukealonso/GLM-5.2-NVFP4/; sleep 120; done; rsync -rt --omit-dir-times --no-perms --no-owner --no-group --info=progress2 --exclude "*.part" /home/spark0/ds4_nvme/models/hf/lukealonso/GLM-5.2-NVFP4/ /mnt/mac/22tb0/models/hf/lukealonso/GLM-5.2-NVFP4/'
  audit_dsapi_profile: |
    cd v2
    PYTHONPATH=src python3 scripts/ds4_pipeline_lifecycle.py audit --topology profiles/topology/static_sparks_glm52_nvfp4_pp13.json --service glm52_nvfp4_pp13
  launch_pipeline: |
    cd v2
    PYTHONPATH=src python3 scripts/ds4_pipeline_lifecycle.py relaunch --topology profiles/topology/static_sparks_glm52_nvfp4_pp13.json --service glm52_nvfp4_pp13 --execute --stagger-s 3 --probe-timeout-s 900
  launch_coordinator: |
    ssh spark0 'cd ~/src/ds4_on_spark/v2 && /home/spark0/ds4-vllm-local/bin/python scripts/ds4_relaunch_coordinator_api.py --skip-pull --skip-build --topology profiles/topology/static_sparks_glm52_nvfp4_pp13.json --profile resident128'
  smoke_openai: |
    ssh spark0 'curl -s http://127.0.0.1:8153/v1/chat/completions -H "content-type: application/json" -d "{\"model\":\"glm-5.2-nvfp4-pp13\",\"messages\":[{\"role\":\"user\",\"content\":\"Answer in one sentence: what is 19*23?\"}],\"max_tokens\":64,\"temperature\":0}"'
  dsapi_smoke_request: |
    cd v2
    printf '%s\n' '{"format":"ds4-inference-request-v1","request_id":"glm52-nvfp4-smoke-001","capability":null,"chat":true,"immediate":true,"job_class":"analysis","max_output_tokens":128,"thinking_budget_tokens":0,"temperature":0.0,"input":{"messages":[{"role":"user","content":"Answer in one sentence: what is 19*23?"}],"prompt":"Answer in one sentence: what is 19*23?"},"output_contract":{"format":"text"},"model_pin":{"profile_id":"glm52_nvfp4_pp13_frontier_v1"}}' >/tmp/glm52_nvfp4_dsapi_smoke.jsonl
    PYTHONPATH=src python3 -m ds4_infer.cli queue-submit --queue-dir /tmp/ds4_glm52_nvfp4_queue --profiles-dir profiles/models --topology profiles/topology/static_sparks_glm52_nvfp4_pp13.json --requests /tmp/glm52_nvfp4_dsapi_smoke.jsonl --batch-id glm52-nvfp4-smoke
  ds4_eval_subset: |
    cd v2
    python3 scripts/ds4_eval_api_runner.py run --base-url http://127.0.0.1:8700 --model glm52_nvfp4_pp13_frontier_v1 --max-output-tokens 1024 --limit 12 --out-dir /private/tmp/ds4_bench/glm52_nvfp4_pp13_dsapi_subset
