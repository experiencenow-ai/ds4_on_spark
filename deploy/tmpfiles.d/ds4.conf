# DS4 directories (install to /etc/tmpfiles.d/ds4.conf then run `systemd-tmpfiles --create`).
d /opt/ds4 0755 root root - -
d /opt/ds4/bin 0755 root root - -
d /opt/ds4/scripts 0755 root root - -
d /etc/ds4 0750 root ds4 - -
d /var/lib/ds4 0750 ds4 ds4 - -
d /var/lib/ds4/models 0750 ds4 ds4 - -
d /var/lib/ds4/cache 0750 ds4 ds4 - -
d /var/lib/ds4/ssh 0700 ds4 ds4 - -
d /var/log/ds4 0750 ds4 ds4 - -
