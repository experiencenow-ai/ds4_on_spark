name: centaur-audit

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'fixtures/model_contract/**'
      - '.audit-baseline.json'
      - '.complexity-baseline.json'
      - '.github/workflows/centaur-audit.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'fixtures/model_contract/**'
      - '.audit-baseline.json'
      - '.complexity-baseline.json'
      - '.github/workflows/centaur-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CENTAUR_REPO_TOKEN: ${{ secrets.CENTAUR_REPO_TOKEN }}
    steps:
      - name: Check out ds4_on_spark
        uses: actions/checkout@v4
      - name: Check out Centaur audit engine
        if: env.CENTAUR_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: experiencenow-ai/centaur
          path: .centaur-audit
          token: ${{ env.CENTAUR_REPO_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Centaur complexity gate
        if: env.CENTAUR_REPO_TOKEN != ''
        run: CENTAUR_REPO="$PWD/.centaur-audit" python3 v2/scripts/score_repo_complexity.py gate --root "$PWD"
      - name: Run Centaur code-rot gate
        if: env.CENTAUR_REPO_TOKEN != ''
        run: PYTHONPATH="$PWD/.centaur-audit" python3 -m v2.audit.repo_code_rot --root "$PWD" --include-dir v2/src --include-dir v2/scripts --include-dir v2/tests --docs-dir v2/docs
      - name: Explain skipped Centaur gates
        if: env.CENTAUR_REPO_TOKEN == ''
        run: echo "Set CENTAUR_REPO_TOKEN to let this workflow check out the private Centaur repo and enforce Centaur audit gates."
      - name: Run v2 tests
        run: PYTHONPATH="$PWD/v2/src" python3 -m unittest discover -s v2/tests -v
