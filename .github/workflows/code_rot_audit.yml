name: code-rot-audit

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.audit-baseline.json'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.audit-baseline.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Run code-rot audit
        run: python3 scripts/audit_code_rot.py
      - name: Run Centaur complexity gate
        run: python3 scripts/score_repo_complexity.py gate
      - name: Run pytest gate
        run: pytest tests/test_no_code_rot.py tests/repo_complexity_gate_test.py -v
