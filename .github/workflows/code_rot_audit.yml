name: code-rot-audit

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tests/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run code-rot audit
        run: python3 scripts/audit_code_rot.py
      - name: Run pytest gate
        run: |
          pip install pytest
          pytest tests/test_no_code_rot.py -v
